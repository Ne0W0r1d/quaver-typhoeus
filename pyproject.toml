[project]
name = "quaver-typhoeus"
version = "0.1.0"
description = "Quaver 播放后端 — 高音质档位协商 + 会员门控 + 明文流中继（Typhoeus / Laevatain），含本地 API sidecar（FastAPI）"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.136",
  "uvicorn>=0.46",
  "pydantic>=2.13",
  "loguru>=0.7.3",
  "qqmusic-api-python",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typhoeus", "quaver_server"]

[tool.uv.sources]
# 主仓 submodule 布局：QQMusicApi SDK（GPLv3+）在上级 vendor/ 目录；升级 = git -C vendor/QQMusicApi pull
qqmusic-api-python = { path = "../QQMusicApi", editable = true }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
