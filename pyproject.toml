[project]
name = "quaver-typhoeus"
version = "0.1.0"
description = "Quaver 播放后端 — 高音质档位协商 + 会员门控 + 明文流中继（Typhoeus / Laevatain）"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
# qqmusic-sdk provider 适配器需要的运行时依赖（api-server 已有，此处仅为独立测试）
sdk = ["qqmusic-api-python"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typhoeus"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
